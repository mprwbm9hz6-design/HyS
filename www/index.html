<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Informe HyS - Establecimientos Gastronómicos</title>
<meta name="theme-color" content="#283c5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --azul: #283c5a;
    --azul-claro: #3a5a86;
    --fondo: #f2f4f7;
    --tarjeta: #ffffff;
    --texto: #1c2530;
    --muted: #6b7684;
    --borde: #dde2e8;
    --ok: #2e7d4f;
    --nc: #b23a3a;
    --obs: #b8862c;
    --na: #8a8f98;
    --sv: #6a4fb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo); color: var(--texto); padding-bottom: 70px;
  }
  header.top {
    background: var(--azul); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10;
  }
  header.top h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header.top p { margin: 2px 0 0; font-size: 12px; opacity: .85; }

  main { max-width: 720px; margin: 0 auto; padding: 12px; }

  .card {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .card-title { font-size: 14px; margin: 0 0 10px; color: var(--azul); }

  .field { display: block; margin-bottom: 10px; }
  .field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--borde); border-radius: 7px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--texto);
  }
  .field textarea { resize: vertical; }

  .item-row { padding: 8px 0; border-top: 1px solid var(--borde); }
  .detalle-field {
    margin-top: 8px; margin-bottom: 0; padding: 8px 10px; background: #fff8ec;
    border: 1px solid #f0d9a6; border-radius: 7px;
  }
  .detalle-field .field-label { color: #8a6a1f; }
  .foto-label { margin-top: 8px; }
  .fotos-item-box { margin-top: 8px; }

  .fotos-wrap { margin-top: 4px; }
  .fotos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .foto-thumb { position: relative; width: 72px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--borde); }
  .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-del {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer;
  }
  .btn-foto {
    display: inline-block; padding: 8px 12px; border-radius: 7px; border: 1px dashed var(--azul);
    color: var(--azul); font-size: 12px; font-weight: 600; cursor: pointer; background: #eef2f7;
  }
  .item-row:first-of-type { border-top: none; }
  .item-label { display: block; font-size: 13px; margin-bottom: 6px; }
  .item-estados { display: flex; gap: 6px; flex-wrap: wrap; }
  .estado-btn {
    flex: 1 1 auto; min-width: 52px; padding: 7px 4px; border-radius: 6px; border: 1px solid var(--borde);
    background: #fff; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .estado-btn.activo.estado-CONFORME { background: var(--ok); border-color: var(--ok); color: #fff; }
  .estado-btn.activo.estado-NOCONFORME { background: var(--nc); border-color: var(--nc); color: #fff; }
  .estado-btn.activo.estado-OBSERVACIÓN { background: var(--obs); border-color: var(--obs); color: #fff; }
  .estado-btn.activo.estado-NOAPLICA { background: var(--na); border-color: var(--na); color: #fff; }
  .estado-btn.activo.estado-NOSEPUDOVERIFICAR { background: var(--sv); border-color: var(--sv); color: #fff; }

  .muted { color: var(--muted); font-size: 12px; }

  .hallazgo-box { border: 1px dashed var(--borde); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .hallazgo-title { font-size: 13px; margin: 0 0 8px; }

  .btn-primario, .btn-secundario {
    display: block; width: 100%; padding: 12px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; margin-top: 8px; cursor: pointer;
  }
  .btn-primario { background: var(--azul); color: #fff; }
  .btn-secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }

  .acciones { position: sticky; bottom: 56px; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff;
    border-top: 1px solid var(--borde); z-index: 10;
  }
  .tab-btn {
    flex: 1; padding: 12px 4px; text-align: center; background: none; border: none;
    font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .tab-btn.activo { color: var(--azul); font-weight: 700; }

  .pantalla { display: none; }
  .pantalla.activa { display: block; }

  .historial-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 0; border-top: 1px solid var(--borde);
  }
  .historial-row:first-of-type { border-top: none; }
  .historial-info { font-size: 13px; }
  .historial-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .historial-btns .btn-secundario { width: auto; margin: 0; padding: 8px 10px; font-size: 12px; }

  .normativa-row { padding: 8px 0; border-top: 1px solid var(--borde); }
  .normativa-row:first-of-type { border-top: none; }
  .normativa-item { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .normativa-row input { margin-top: 4px; }
</style>
</head>
<body>
  <header class="top">
    <h1>📋 Informe HyS</h1>
    <p>Establecimientos gastronómicos — funciona sin conexión</p>
  </header>

  <main>
    <div id="pantalla-formulario" class="pantalla activa">
      <div id="app"></div>
    </div>

    <div id="pantalla-historial" class="pantalla">
      <div class="card">
        <h2 class="card-title">Informes generados en este dispositivo</h2>
        <div id="historial"></div>
      </div>
    </div>

    <div id="pantalla-normativa" class="pantalla">
      <div id="normativa-lista"></div>
    </div>
  </main>

  <nav class="tabs">
    <button id="tab-formulario" class="tab-btn activo" type="button">Formulario</button>
    <button id="tab-historial" class="tab-btn" type="button">Historial</button>
    <button id="tab-normativa" class="tab-btn" type="button">Normativa</button>
  </nav>

  <script src="jspdf.min.js"></script>
  <script src="jspdf.autotable.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
